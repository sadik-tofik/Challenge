version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    command: ./rr serve -v -d
    volumes:
      - .:/app
    ports:
      - "9001:9001"
    restart: unless-stopped

  envoy:
    image: envoyproxy/envoy:v1.22.0
    command: envoy -c /etc/envoy/envoy.yaml
    volumes:
      - ./envoy.yaml:/etc/envoy/envoy.yaml:ro
    ports:
      - "8080:8080"
    depends_on:
      - backend
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WDS_SOCKET_PORT=0
    depends_on:
      - envoy
    restart: unless-stopped
